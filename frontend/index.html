<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Knowledge Base</title>
    
    <link rel="stylesheet" href="css/style.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <div id="loading-overlay" class="hidden">
        <div class="spinner"></div>
        <p id="loading-text">กำลังประมวลผลข้อมูล...</p>
    </div>

    <div class="container">

        <div id="home-view">
            <header class="main-header">
                <h1><i class="fa-solid fa-brain"></i> AI Knowledge Base</h1>
                <p>เลือกเอกสารเพื่อเริ่มสนทนา หรืออัปโหลดเอกสารใหม่</p>
            </header>

            <section class="upload-section">
                <h2><i class="fa-solid fa-cloud-arrow-up"></i> Ingest New Data</h2>
                <form id="upload-form">
                    <div class="form-group">
                        <label>ตั้งชื่อโปรเจกต์ (Doc ID):</label>
                        <input type="text" id="doc-id-input" placeholder="เช่น AI-DURIAN, Policy-2024" required>
                        <small>ชื่อนี้จะถูกใช้เป็นชื่อ Folder และชื่อการ์ด</small>
                    </div>
                    <div class="form-group">
                        <label>เลือกไฟล์ (PDF):</label>
                        <input type="file" id="file-input" accept=".pdf" required>
                    </div>
                    <button type="submit" class="btn-primary">
                        <i class="fa-solid fa-rocket"></i> Upload & Ingest
                    </button>
                </form>
            </section>

            <section class="documents-section">
                <h2><i class="fa-solid fa-folder-open"></i> Available Knowledge</h2>
                <div id="doc-grid" class="doc-grid">
                    </div>
            </section>
        </div>

        <div id="chat-view" class="hidden">
            <div class="chat-container">
                <div class="chat-header">
                    <div class="chat-title">
                        <button id="back-btn" class="btn-icon"><i class="fa-solid fa-arrow-left"></i></button>
                        <div>
                            <h3>RAG Chat</h3>
                            <span id="current-doc-name" class="badge">Selecting...</span>
                        </div>
                    </div>
                </div>

                <div id="chat-history" class="chat-history">
                    <div class="message bot-message">
                        <div class="bubble">สวัสดีครับ มีอะไรให้ช่วยเกี่ยวกับเอกสารนี้ถามได้เลย!</div>
                    </div>
                </div>

                <div class="chat-input-area">
                    <form id="chat-form">
                        <input type="text" id="chat-input" placeholder="ถามคำถามเกี่ยวกับเอกสารนี้..." autocomplete="off">
                        <button type="submit" class="btn-send"><i class="fa-solid fa-paper-plane"></i></button>
                    </form>
                </div>
            </div>
        </div>

    </div>

    <script src="js/app.js"></script>
</body>
</html>
