<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Document Assistant</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Sarabun', 'sans-serif'] },
                    colors: {
                        brand: { 500: '#3b82f6', 600: '#2563eb' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 h-screen flex flex-col overflow-hidden">

    <header class="bg-white border-b border-slate-200 h-16 flex-none flex items-center justify-between px-6 shadow-sm z-20">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold">AI</div>
            <h1 class="text-lg font-semibold text-slate-700">Document Assistant</h1>
        </div>
        
        <div class="flex gap-2">
            <select id="docSelect" class="text-sm border border-slate-300 rounded-md px-2 py-1 outline-none bg-slate-50 text-slate-600">
                <option value="">📚 ค้นหาทุกเอกสาร</option>
            </select>
        </div>
    </header>

    <main class="flex-1 overflow-hidden relative flex flex-col">
        <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-6 scroll-smooth pb-4">
            <div class="flex justify-start w-full animate-fade-in-up">
                <div class="w-8 h-8 rounded-full bg-blue-600 flex-none flex items-center justify-center text-white text-xs mr-3 mt-1 shadow-sm">AI</div>
                <div class="bg-white border border-slate-200 text-slate-700 p-4 rounded-2xl rounded-tl-none shadow-sm max-w-[85%]">
                    สวัสดีครับ! ผมคือ AI ผู้ช่วยค้นหาข้อมูลในเอกสาร 📄<br>
                    มีอะไรให้ผมช่วยค้นหา หรือต้องการอัปโหลดไฟล์ PDF ใหม่บอกได้เลยครับ
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 p-4 flex-none z-20">
        <div class="max-w-4xl mx-auto w-full relative">
            
            <div id="attachmentInfo" class="absolute -top-8 left-0 text-xs font-semibold px-2"></div>

            <div class="relative flex items-end gap-2 bg-slate-100 p-2 rounded-xl border border-slate-200 focus-within:ring-2 focus-within:ring-blue-100 transition-all">
                
                <input id="fileInput" type="file" accept="application/pdf" class="hidden" />
                <button id="uploadBtn" type="button" class="p-3 text-slate-400 hover:text-blue-600 hover:bg-white rounded-lg transition-colors" title="อัปโหลด PDF">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
                    </svg>
                </button>

                <textarea id="chatInput" rows="1" class="w-full bg-transparent border-none focus:ring-0 text-slate-700 placeholder-slate-400 py-3 max-h-32 resize-none" placeholder="ถามคำถามเกี่ยวกับเอกสาร..."></textarea>

                <button id="sendBtn" type="button" class="p-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                    </svg>
                </button>
            </div>
            
            <p class="text-[10px] text-center text-slate-400 mt-2">AI สามารถตอบคำถามจาก Text, ตาราง และรูปภาพในเอกสาร PDF</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
