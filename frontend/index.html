<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Document Assistant</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col overflow-hidden">

    <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm z-10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-lg">AI</div>
            <div>
                <h1 class="font-bold text-slate-800 text-lg">Document Assistant</h1>
                <p class="text-xs text-slate-500">ถาม-ตอบ จากเอกสารของคุณ</p>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-hidden flex flex-col relative max-w-5xl mx-auto w-full">
        <div id="chatMessages" class="flex-1 overflow-y-auto p-6 space-y-6 scroll-smooth pb-32">
            <div class="flex justify-start mb-4">
                <div class="bg-white border border-slate-200 text-slate-600 px-5 py-3 rounded-2xl rounded-tl-none shadow-sm max-w-[85%]">
                    สวัสดีครับ! อัปโหลดไฟล์ PDF แล้วถามผมได้เลยครับ (ผมดึงรูปภาพจากเอกสารให้ดูได้ด้วยนะ 📸)
                </div>
            </div>
        </div>

        <div class="absolute bottom-0 left-0 w-full p-4 bg-white/90 backdrop-blur-md border-t border-slate-200">
            <div id="attachmentInfo" class="hidden absolute -top-8 left-6 text-xs font-semibold bg-blue-100 text-blue-600 px-3 py-1 rounded-full"></div>
            
            <div class="flex gap-2 items-end bg-slate-100 p-2 rounded-2xl border border-slate-200 focus-within:ring-2 focus-within:ring-blue-100 transition-all shadow-inner">
                
                <input type="file" id="fileInput" class="hidden" accept=".pdf">
                <button id="uploadBtn" class="p-3 text-slate-400 hover:text-blue-600 hover:bg-white rounded-xl transition-all" title="อัปโหลดเอกสาร">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" /></svg>
                </button>

                <textarea id="chatInput" rows="1" class="flex-1 bg-transparent border-none focus:ring-0 text-slate-700 placeholder-slate-400 resize-none py-3 max-h-32 focus:outline-none" placeholder="พิมพ์คำถามที่นี่..."></textarea>

                <button id="sendBtn" class="p-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700 shadow-md transition-all active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>
                </button>
            </div>
            
            <div class="mt-2 flex justify-center">
                <select id="docSelect" class="text-xs text-slate-400 bg-transparent border-none focus:ring-0 cursor-pointer hover:text-slate-600 text-center outline-none">
                    <option value="">Searching all documents</option>
                </select>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
