# =====================================================================
# nginx reverse proxy สำหรับ FastAPI backend
#
# - HTTP :80  ส่งต่อไปยัง backend:8000
# - รองรับ upload PDF ขนาดใหญ่ (client_max_body_size 200M)
# - อนุญาต WebSocket (เผื่อขยายในอนาคต)
# - ตั้ง read/send timeout ให้พอสำหรับงาน ingest ที่ใช้เวลานาน
#
# เปิด HTTPS: uncomment block ล่างสุด และ mount cert เข้า /etc/nginx/certs
# =====================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # gzip เนื้อหา static/HTML/JSON
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml text/xml image/svg+xml;

    # PDF/ไฟล์ upload ขนาดใหญ่
    client_max_body_size 200M;

    upstream backend_upstream {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ส่ง header ตัวตนของผู้เรียกไปให้ backend
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # timeout ให้ยาวพอสำหรับงาน ingest (subprocess เรียก run_ingestion)
        proxy_connect_timeout  30s;
        proxy_send_timeout     600s;
        proxy_read_timeout     600s;

        # WebSocket upgrade (เผื่ออนาคต)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        location / {
            proxy_pass http://backend_upstream;
        }
    }

    # -----------------------------------------------------------------
    # HTTPS - เปิดใช้เมื่อพร้อม cert (เช่น Let's Encrypt / cert จากมหาลัย)
    # -----------------------------------------------------------------
    # server {
    #     listen 443 ssl http2;
    #     server_name ai-ingest.your-university.ac.th;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     client_max_body_size 200M;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto https;
    #     proxy_read_timeout 600s;
    #
    #     location / {
    #         proxy_pass http://backend_upstream;
    #     }
    # }
}
