# =====================================================================
# AI Data Ingestion Pipeline - Production Compose
#
# บริการ:
#   backend  : FastAPI/uvicorn (GPU) - พอร์ต internal 8000
#   nginx    : Reverse proxy         - พอร์ต public 80 (443 เมื่อพร้อม SSL)
#
# Volumes (persist):
#   ./ingested   -> ผลลัพธ์ ingest (metadata/text/table/image json + md)
#   ./uploads    -> PDF ที่ user upload มา
#   ./chroma_db  -> Vector DB (Chroma persistent)
#   ./logs       -> qa_log.jsonl
#   hf_cache     -> HuggingFace/Sentence-Transformers model cache (named volume)
#
# GPU:
#   ต้องติดตั้ง nvidia-container-toolkit บน host (ดู DEPLOY.md)
# =====================================================================
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: data-ingestion-docling:latest
    container_name: ingestion-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # ค่า default (override ได้ผ่าน .env)
      TZ: Asia/Bangkok
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./ingested:/app/ingested
      - ./uploads:/app/uploads
      - ./chroma_db:/app/chroma_db
      - ./logs:/app/logs
      - hf_cache:/opt/hf_cache
    expose:
      - "8000"
    # ให้ container เห็น GPU ทุกตัวของ host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    networks:
      - ingestion-net

  nginx:
    image: nginx:1.27-alpine
    container_name: ingestion-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      # เปิด 443 เมื่อพร้อม cert (uncomment + mount cert directory)
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - ingestion-net

volumes:
  hf_cache:
    name: ingestion_hf_cache

networks:
  ingestion-net:
    name: ingestion-net
    driver: bridge
